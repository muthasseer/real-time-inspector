name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Extract Android project
        run: |
          unzip -q Real_Time_Inspector_Android_QR_v2.zip

      - name: Build Debug APK
        working-directory: Real_Time_Inspector_Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: real-time-inspector-debug-apk
          path: Real_Time_Inspector_Android/app/build/outputs/apk/debug/*.apk
