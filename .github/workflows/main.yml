name: Build Android APK V13

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Extract Android.zip and find project root
        run: |
          mkdir -p src
          unzip -q Android.zip -d src
          SETTINGS=$(find src -name settings.gradle.kts | head -1)
          test -n "$SETTINGS"
          ROOT=$(dirname "$SETTINGS")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/app/src/main/java/com/absecuritas/realtimeinspector/MainActivity.kt"
          grep -n 'versionName' "$ROOT/app/build.gradle.kts"

      - name: Build debug APK
        run: |
          cd "$ROOT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
